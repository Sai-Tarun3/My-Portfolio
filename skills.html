                        <tr>

                        <tr>

                        <tr>

                <div class="column">

                            <td><meter id="meter-css" min="0" max="100" value="0"></meter></td>

                        <tr>

            </div>
        </div>

        <div class="button-container">
            <a href="index.html" class="button-link">Go to Home</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const meters = [
                { id: "meter-aws", value: 30 },
                { id: "meter-docker", value: 90 },
                { id: "meter-jenkins", value: 80 },
                { id: "meter-ansible", value: 50 },
                { id: "meter-linux", value: 60 },
                { id: "meter-kubernetes", value: 70 },
                { id: "meter-git", value: 50 },
                { id: "meter-html", value: 100 },
                { id: "meter-css", value: 90 },
                { id: "meter-js", value: 70 },
                { id: "meter-react", value: 60 },
                { id: "meter-oracle", value: 60 },
                { id: "meter-java", value: 60 },
                { id: "meter-bootstrap", value: 60 }
            ];

            meters.forEach(meter => {
                const meterElement = document.getElementById(meter.id);
                let currentValue = 0;

                const interval = setInterval(() => {
                    if (currentValue < meter.value) {
                        currentValue++;
                        meterElement.value = currentValue;
                    } else {
                        clearInterval(interval);
                    }
                }, 20); // Adjust the speed of the animation by changing the interval time
            });
        });
    </script>
</body>
